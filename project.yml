name: FeatherNote
options:
  bundleIdPrefix: app.feathermark
  deploymentTarget:
    macOS: "15.0"
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: 0.0.1
    CURRENT_PROJECT_VERSION: 1
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES
  configs:
    Release:
      ONLY_ACTIVE_ARCH: NO
packages:
  FeatherCore:
    path: Packages/FeatherCore
  FeatherCrypto:
    path: Packages/FeatherCrypto
  FeatherSync:
    path: Packages/FeatherSync
  FeatherEditor:
    path: Packages/FeatherEditor
  FeatherImport:
    path: Packages/FeatherImport
  FeatherAppModel:
    path: Packages/FeatherAppModel
targets:
  FeatherNote:
    type: application
    platform: macOS
    sources: [FeatherNote]
    info:
      path: FeatherNote/Info.plist
      properties:
        # Feather Cloud's address and whether it has billing. Set CLOUD_DOMAIN once the domain is bought
        # (server/docs/hosting-mac-mini.md); 1.0.0 runs it free, so billing is off.
        FeatherCloudURL: https://CLOUD_DOMAIN
        FeatherCloudBilling: false
        CFBundleURLTypes:
          - CFBundleURLName: app.feathermark.FeatherMark
            CFBundleURLSchemes: [feathermark]
        NSServices:
          - NSMenuItem:
              default: Save to FeatherMark
            NSMessage: saveToFeatherNote
            NSPortName: FeatherMark
            NSSendTypes: [public.utf8-plain-text, public.url, NSStringPboardType]
    settings:
      base:
        PRODUCT_NAME: FeatherMark
        PRODUCT_MODULE_NAME: FeatherNote
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        PRODUCT_BUNDLE_IDENTIFIER: app.feathermark.FeatherMark
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: FeatherMark
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
    dependencies:
      - package: FeatherCore
      - package: FeatherCrypto
      - package: FeatherSync
      - package: FeatherEditor
      - package: FeatherImport
      - package: FeatherAppModel
      - target: ShareExtension
  ShareExtension:
    type: app-extension
    platform: macOS
    sources:
      - ShareExtension
      - FeatherNote/Capture/InboxHandOff.swift
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: FeatherMark
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsFileWithMaxCount: 10
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.feathermark.FeatherMark.Share
        PRODUCT_NAME: ShareExtension
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: FeatherMark
    dependencies:
      - package: FeatherCore
  FeatherNoteTests:
    type: bundle.unit-test
    platform: macOS
    sources: [FeatherNoteTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_HARDENED_RUNTIME: NO
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/FeatherMark.app/Contents/MacOS/FeatherMark"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: FeatherNote
  FeatherNoteUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [Tests/UI]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_HARDENED_RUNTIME: NO
    dependencies:
      - target: FeatherNote
  FeatherMarkiOS:
    # The iPhone and iPad app (Phase 12). One universal app, the same bundle id as the Mac.
    type: application
    platform: iOS
    sources: [iOSApp]
    info:
      path: iOSApp/Info.plist
      properties:
        # The same as the Mac app's (CloudServer reads them); sync arrives in Phase 15.
        FeatherCloudURL: https://CLOUD_DOMAIN
        FeatherCloudBilling: false
    settings:
      base:
        PRODUCT_NAME: FeatherMark
        PRODUCT_MODULE_NAME: FeatherMarkiOS
        PRODUCT_BUNDLE_IDENTIFIER: app.feathermark.FeatherMark
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: FeatherMark
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # No app icon until Phase 16's App Store assets (the Mac app has none yet either).
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        DEVELOPMENT_TEAM: T6ASVW97L9
        CODE_SIGN_STYLE: Automatic
        "CODE_SIGN_IDENTITY[sdk=iphoneos*]": "Apple Development"
        ENABLE_HARDENED_RUNTIME: NO
    dependencies:
      - package: FeatherCore
      - package: FeatherEditor
        product: FeatherEditorCore
      - package: FeatherAppModel
  FeatherMarkiOSTests:
    type: bundle.unit-test
    platform: iOS
    sources: [iOSAppTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_HARDENED_RUNTIME: NO
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/FeatherMark.app/FeatherMark"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: FeatherMarkiOS
  FeatherMarkiOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests/iOSUI]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_HARDENED_RUNTIME: NO
    dependencies:
      - target: FeatherMarkiOS
schemes:
  FeatherNote:
    build:
      targets:
        FeatherNote: all
    test:
      targets:
        - FeatherNoteTests
        - FeatherNoteUITests
        - package: FeatherCore/FeatherCoreTests
        - package: FeatherCrypto/FeatherCryptoTests
        - package: FeatherSync/FeatherSyncTests
        - package: FeatherEditor/FeatherEditorCoreTests
        - package: FeatherEditor/FeatherEditorTests
        - package: FeatherImport/FeatherImportTests
        - package: FeatherAppModel/FeatherAppModelTests
  FeatherMarkiOS:
    build:
      targets:
        FeatherMarkiOS: all
    test:
      targets:
        - FeatherMarkiOSTests
        - FeatherMarkiOSUITests
