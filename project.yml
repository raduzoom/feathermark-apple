name: FeatherNote
options:
  bundleIdPrefix: app.feathermark
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: 0.0.1
    CURRENT_PROJECT_VERSION: 1
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES
  configs:
    Release:
      ONLY_ACTIVE_ARCH: NO
packages:
  FeatherCore:
    path: Packages/FeatherCore
  FeatherCrypto:
    path: Packages/FeatherCrypto
  FeatherSync:
    path: Packages/FeatherSync
  FeatherEditor:
    path: Packages/FeatherEditor
  FeatherImport:
    path: Packages/FeatherImport
  FeatherAppModel:
    path: Packages/FeatherAppModel
targets:
  FeatherNote:
    type: application
    platform: macOS
    sources: [FeatherNote]
    info:
      path: FeatherNote/Info.plist
      properties:
        # Feather Cloud's address and whether it has billing. Set CLOUD_DOMAIN once the domain is bought
        # (server/docs/hosting-mac-mini.md); 1.0.0 runs it free, so billing is off.
        FeatherCloudURL: https://CLOUD_DOMAIN
        FeatherCloudBilling: false
        CFBundleURLTypes:
          - CFBundleURLName: app.feathermark.FeatherMark
            CFBundleURLSchemes: [feathermark]
        NSServices:
          - NSMenuItem:
              default: Save to FeatherMark
            NSMessage: saveToFeatherNote
            NSPortName: FeatherMark
            NSSendTypes: [public.utf8-plain-text, public.url, NSStringPboardType]
    settings:
      base:
        PRODUCT_NAME: FeatherMark
        PRODUCT_MODULE_NAME: FeatherNote
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        PRODUCT_BUNDLE_IDENTIFIER: app.feathermark.FeatherMark
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: FeatherMark
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
    dependencies:
      - package: FeatherCore
      - package: FeatherCrypto
      - package: FeatherSync
      - package: FeatherEditor
      - package: FeatherImport
      - package: FeatherAppModel
      - target: ShareExtension
  ShareExtension:
    type: app-extension
    platform: macOS
    sources:
      - ShareExtension
      - FeatherNote/Capture/InboxHandOff.swift
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: FeatherMark
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsFileWithMaxCount: 10
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.feathermark.FeatherMark.Share
        PRODUCT_NAME: ShareExtension
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: FeatherMark
    dependencies:
      - package: FeatherCore
  FeatherNoteTests:
    type: bundle.unit-test
    platform: macOS
    sources: [FeatherNoteTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_HARDENED_RUNTIME: NO
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/FeatherMark.app/Contents/MacOS/FeatherMark"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: FeatherNote
  FeatherNoteUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [Tests/UI]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_HARDENED_RUNTIME: NO
    dependencies:
      - target: FeatherNote
schemes:
  FeatherNote:
    build:
      targets:
        FeatherNote: all
    test:
      targets:
        - FeatherNoteTests
        - FeatherNoteUITests
        - package: FeatherCore/FeatherCoreTests
        - package: FeatherCrypto/FeatherCryptoTests
        - package: FeatherSync/FeatherSyncTests
        - package: FeatherEditor/FeatherEditorCoreTests
        - package: FeatherEditor/FeatherEditorTests
        - package: FeatherImport/FeatherImportTests
        - package: FeatherAppModel/FeatherAppModelTests
